<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYOR: Build Your Own Rothko</title>
  <style>
    :root {
      --bg-wall: #121010;
      --panel-bg: #1c1817;
      --panel-border: #2e2624;
      --accent: #b84a28;
      --text: #d8ceca;
      --text-muted: #8c807b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-wall);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left control sidebar */
    #sidebar {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
    }

    .brand {
      padding: 20px 24px;
      border-bottom: 1px solid var(--panel-border);
    }
    .brand h1 {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ede5e0;
    }
    .brand p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }

    .section {
      padding: 18px 24px;
      border-bottom: 1px solid var(--panel-border);
    }
    .section-title {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* Canvas aspect ratio selector */
    .ratio-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-pill {
      background: #25201e;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn-pill:hover, .btn-pill.active {
      background: var(--accent);
      border-color: #d45933;
      color: #fff;
    }

    /* Palette swatches */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .color-swatch {
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
    }
    .color-swatch:hover {
      transform: scale(1.08);
    }
    .color-swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    /* Layer block item */
    .layers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .layer-card {
      background: #25201f;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px;
      position: relative;
    }
    .layer-card.active {
      border-color: var(--accent);
    }
    .layer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .layer-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .layer-swatch-mini {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      display: inline-block;
    }
    .btn-danger {
      background: transparent;
      border: none;
      color: #92534c;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 4px;
    }
    .btn-danger:hover {
      color: #e06d60;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }
    .slider-row label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    select {
      width: 100%;
      background: #171413;
      color: var(--text);
      border: 1px solid var(--panel-border);
      padding: 6px 8px;
      font-size: 0.78rem;
      border-radius: 4px;
      margin-top: 4px;
      outline: none;
    }

    .btn-add {
      width: 100%;
      padding: 9px;
      background: #282220;
      border: 1px dashed #4a3e3a;
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 10px;
      transition: background 0.15s;
    }
    .btn-add:hover {
      background: #362e2a;
      border-color: #6d5b55;
    }

    /* Gallery / Lighting view */
    #gallery {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at var(--light-x, 50%) var(--light-y, 40%), 
                  rgba(255, 230, 200, calc(var(--light-intensity, 0.4) * 0.45)) 0%, 
                  rgba(20, 15, 14, 0.95) 70%, 
                  #070606 100%);
      overflow: hidden;
      cursor: crosshair;
    }

    #gallery-wall {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.85);
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 1px rgba(255,255,255,0.1);
      transition: width 0.2s, height 0.2s;
    }

    canvas {
      display: block;
      background: #150f0e;
    }

    /* Lighting controls bar */
    .gallery-hud {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 16px;
      background: rgba(22, 18, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      font-size: 0.75rem;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .hud-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-control input[type=range] {
      width: 90px;
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
    }
    .hud-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* Preset selector */
    .preset-selector {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .preset-pill {
      flex: 1;
      font-size: 0.68rem;
      padding: 5px;
      background: #25201f;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
    }
    .preset-pill:hover {
      color: #fff;
      border-color: #665;
    }
  </style>
</head>
<body>

  <!-- Controls Sidebar -->
  <div id="sidebar">
    <div class="brand">
      <h1>B.Y.O.R.</h1>
      <p>Build Your Own Rothko &bull; Chapel Edition</p>
    </div>

    <!-- Canvas Proportion -->
    <div class="section">
      <div class="section-title">Canvas Proportion</div>
      <div class="ratio-group">
        <button class="btn-pill active" data-ratio="monumental">Monumental<br><span style="font-size:0.65rem; opacity:0.6;">3 : 4</span></button>
        <button class="btn-pill" data-ratio="mural">Mural<br><span style="font-size:0.65rem; opacity:0.6;">4 : 3</span></button>
        <button class="btn-pill" data-ratio="altar">Altar<br><span style="font-size:0.65rem; opacity:0.6;">2 : 3</span></button>
      </div>
    </div>

    <!-- Presets -->
    <div class="section">
      <div class="section-title">Historic Color Harmonies</div>
      <div class="preset-selector">
        <button class="preset-pill" onclick="loadPreset('no14')">No. 14 (1960)</button>
        <button class="preset-pill" onclick="loadPreset('seagram')">Seagram</button>
        <button class="preset-pill" onclick="loadPreset('ochre')">Ochre/Red</button>
        <button class="preset-pill" onclick="loadPreset('black')">Late Dark</button>
      </div>
    </div>

    <!-- Color Palette Selection -->
    <div class="section">
      <div class="section-title">Active Pigment</div>
      <div class="palette-grid" id="palette-picker"></div>
    </div>

    <!-- Background Ground Layer -->
    <div class="section">
      <div class="section-title">Primer / Undercoat Wash</div>
      <div class="slider-row">
        <label>Ground Tone Tint</label>
        <div class="palette-grid" id="ground-picker" style="grid-template-columns: repeat(5, 1fr);"></div>
      </div>
      <div class="slider-row" style="margin-top: 10px;">
        <label>Canvas Texture Grain <span id="grain-val">25%</span></label>
        <input type="range" id="grain-slider" min="0" max="60" value="25">
      </div>
    </div>

    <!-- Rectangular Color Fields -->
    <div class="section" style="flex: 1;">
      <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>Color Slabs (Top to Bottom)</span>
      </div>
      <div class="layers-list" id="layers-container"></div>
      <button class="btn-add" id="btn-add-slab">+ Append Pigment Slab</button>
    </div>
  </div>

  <!-- Gallery Viewing Space -->
  <div id="gallery">
    <div id="gallery-wall"></div>
    <div class="canvas-container" id="canvas-wrap">
      <canvas id="rothko-canvas" width="600" height="800"></canvas>
    </div>

    <!-- Gallery Lighting HUD -->
    <div class="gallery-hud">
      <div class="hud-control">
        <span>Curator Spotlight:</span>
        <input type="range" id="light-int" min="0" max="100" value="45">
      </div>
      <div class="hud-control">
        <span>Gallery Temp:</span>
        <input type="range" id="light-temp" min="2000" max="6500" value="3200">
      </div>
      <button class="hud-btn" id="btn-export">Export Canvas</button>
      <button class="hud-btn" id="btn-regenerate">Diffuse Borders</button>
    </div>
  </div>

  <script>
    // Classic Rothko Historic Pigment Spectrum
    const PALETTE = [
      { name: "Crimson Alizarin", hex: "#87151a" },
      { name: "Burnt Ochre", hex: "#bb4e1f" },
      { name: "Deep Cadmium Yellow", hex: "#d89617" },
      { name: "Raw Umber", hex: "#3b2219" },
      { name: "Plum Aubergine", hex: "#381726" },
      { name: "Venetian Red", hex: "#9b2e25" },
      { name: "Ultramarine Noir", hex: "#151b32" },
      { name: "Cinnabar Orange", hex: "#c94628" },
      { name: "Obsidian Slate", hex: "#1c1c1f" },
      { name: "Bone Terracotta", hex: "#9a6a57" }
    ];

    let groundColor = "#3d1316";
    let activePaletteColor = PALETTE[1].hex;

    // Slabs State
    let slabs = [
      {
        id: 1,
        color: "#9b2e25",
        heightRatio: 0.42,
        bleed: 38,
        feather: 34,
        interaction: "soft-light",
        transparency: 0.92,
        jitterSeed: Math.random()
      },
      {
        id: 2,
        color: "#151b32",
        heightRatio: 0.38,
        bleed: 44,
        feather: 42,
        interaction: "multiply",
        transparency: 0.88,
        jitterSeed: Math.random()
      }
    ];

    // Presets definitions
    const PRESETS = {
      no14: {
        ground: "#4a1215",
        slabs: [
          { color: "#87151a", heightRatio: 0.46, bleed: 40, feather: 38, interaction: "multiply", transparency: 0.95 },
          { color: "#151b32", heightRatio: 0.36, bleed: 48, feather: 44, interaction: "darken", transparency: 0.90 }
        ]
      },
      seagram: {
        ground: "#230b0f",
        slabs: [
          { color: "#381726", heightRatio: 0.38, bleed: 52, feather: 50, interaction: "soft-light", transparency: 0.85 },
          { color: "#87151a", heightRatio: 0.42, bleed: 46, feather: 45, interaction: "overlay", transparency: 0.80 }
        ]
      },
      ochre: {
        ground: "#82321c",
        slabs: [
          { color: "#d89617", heightRatio: 0.40, bleed: 35, feather: 35, interaction: "soft-light", transparency: 0.92 },
          { color: "#bb4e1f", heightRatio: 0.44, bleed: 40, feather: 38, interaction: "multiply", transparency: 0.88 }
        ]
      },
      black: {
        ground: "#1a1617",
        slabs: [
          { color: "#1c1c1f", heightRatio: 0.45, bleed: 55, feather: 48, interaction: "multiply", transparency: 0.95 },
          { color: "#3b2219", heightRatio: 0.35, bleed: 50, feather: 45, interaction: "hard-light", transparency: 0.82 }
        ]
      }
    };

    const canvas = document.getElementById('rothko-canvas');
    const ctx = canvas.getContext('2d');
    const gallery = document.getElementById('gallery');

    // Lighting coordinates
    let lightX = 50;
    let lightY = 40;

    // Fast PRNG for reproducible brush organic drift
    function pseudoNoise(x, y, seed) {
      let n = Math.sin(x * 12.9898 + y * 78.233 + seed * 43758.5453) * 43758.5453;
      return n - Math.floor(n);
    }

    function initUI() {
      // Swatches for active color
      const pPicker = document.getElementById('palette-picker');
      pPicker.innerHTML = '';
      PALETTE.forEach((item, idx) => {
        const d = document.createElement('div');
        d.className = 'color-swatch' + (item.hex === activePaletteColor ? ' selected' : '');
        d.style.backgroundColor = item.hex;
        d.title = item.name;
        d.onclick = () => {
          document.querySelectorAll('#palette-picker .color-swatch').forEach(el => el.classList.remove('selected'));
          d.classList.add('selected');
          activePaletteColor = item.hex;
        };
        pPicker.appendChild(d);
      });

      // Swatches for ground
      const gPicker = document.getElementById('ground-picker');
      gPicker.innerHTML = '';
      PALETTE.forEach((item) => {
        const d = document.createElement('div');
        d.className = 'color-swatch' + (item.hex === groundColor ? ' selected' : '');
        d.style.backgroundColor = item.hex;
        d.title = item.name;
        d.onclick = () => {
          document.querySelectorAll('#ground-picker .color-swatch').forEach(el => el.classList.remove('selected'));
          d.classList.add('selected');
          groundColor = item.hex;
          renderRothko();
        };
        gPicker.appendChild(d);
      });

      renderLayersList();

      // Aspect ratio buttons
      document.querySelectorAll('.btn-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const ratio = btn.dataset.ratio;
          if (ratio === 'monumental') {
            canvas.width = 600;
            canvas.height = 800;
          } else if (ratio === 'mural') {
            canvas.width = 800;
            canvas.height = 600;
          } else if (ratio === 'altar') {
            canvas.width = 500;
            canvas.height = 850;
          }
          renderRothko();
        });
      });

      // Gallery dynamic spotlight on mousemove
      gallery.addEventListener('mousemove', (e) => {
        const rect = gallery.getBoundingClientRect();
        lightX = ((e.clientX - rect.left) / rect.width) * 100;
        lightY = ((e.clientY - rect.top) / rect.height) * 100;
        updateLighting();
      });

      // HUD lighting controls
      document.getElementById('light-int').addEventListener('input', (e) => {
        updateLighting();
      });

      document.getElementById('light-temp').addEventListener('input', (e) => {
        updateLighting();
      });

      document.getElementById('grain-slider').addEventListener('input', (e) => {
        document.getElementById('grain-val').innerText = `${e.target.value}%`;
        renderRothko();
      });

      document.getElementById('btn-add-slab').addEventListener('click', () => {
        slabs.push({
          id: Date.now(),
          color: activePaletteColor,
          heightRatio: 0.25,
          bleed: 35,
          feather: 35,
          interaction: 'soft-light',
          transparency: 0.88,
          jitterSeed: Math.random()
        });
        renderLayersList();
        renderRothko();
      });

      document.getElementById('btn-regenerate').addEventListener('click', () => {
        slabs.forEach(s => s.jitterSeed = Math.random());
        renderRothko();
      });

      document.getElementById('btn-export').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'rothko-study.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function updateLighting() {
      const intensity = document.getElementById('light-int').value / 100;
      const kelvin = parseInt(document.getElementById('light-temp').value);
      
      // Approximate Kelvin to RGB tint
      let r = 255, g = 220, b = 180;
      if (kelvin < 3000) {
        r = 255; g = 190; b = 140;
      } else if (kelvin > 5000) {
        r = 220; g = 235; b = 255;
      }

      gallery.style.setProperty('--light-x', `${lightX.toFixed(1)}%`);
      gallery.style.setProperty('--light-y', `${lightY.toFixed(1)}%`);
      gallery.style.setProperty('--light-intensity', intensity);
      
      const wall = document.getElementById('gallery-wall');
      wall.style.background = `radial-gradient(circle at ${lightX}% ${lightY}%, rgba(${r}, ${g}, ${b}, ${intensity * 0.35}) 0%, rgba(10,8,8,0.95) 75%)`;
    }

    function renderLayersList() {
      const container = document.getElementById('layers-container');
      container.innerHTML = '';

      slabs.forEach((slab, index) => {
        const card = document.createElement('div');
        card.className = 'layer-card';

        card.innerHTML = `
          <div class="layer-header">
            <div class="layer-title">
              <span class="layer-swatch-mini" style="background:${slab.color}"></span>
              Slab #${index + 1}
            </div>
            ${slabs.length > 1 ? `<button class="btn-danger" onclick="removeSlab(${index})">&times; Remove</button>` : ''}
          </div>

          <div class="slider-row">
            <label>Color Swatch (Tap to replace with active pigment)</label>
            <div style="height: 20px; background: ${slab.color}; border-radius: 3px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2);"
                 onclick="replaceSlabColor(${index})"></div>
          </div>

          <div class="slider-row">
            <label>Vertical Slab Scale <span>${Math.round(slab.heightRatio * 100)}%</span></label>
            <input type="range" min="15" max="65" value="${slab.heightRatio * 100}" 
                   oninput="updateSlabProp(${index}, 'heightRatio', this.value / 100)">
          </div>

          <div class="slider-row">
            <label>Border Feather / Bleed <span>${slab.feather}px</span></label>
            <input type="range" min="10" max="80" value="${slab.feather}" 
                   oninput="updateSlabProp(${index}, 'feather', parseInt(this.value))">
          </div>

          <div class="slider-row">
            <label>Glaze Opacity <span>${Math.round(slab.transparency * 100)}%</span></label>
            <input type="range" min="40" max="100" value="${slab.transparency * 100}" 
                   oninput="updateSlabProp(${index}, 'transparency', this.value / 100)">
          </div>

          <div class="slider-row">
            <label>Border Pigment Interaction</label>
            <select onchange="updateSlabProp(${index}, 'interaction', this.value)">
              <option value="source-over" ${slab.interaction === 'source-over' ? 'selected' : ''}>Opaque Stacking (Source-Over)</option>
              <option value="multiply" ${slab.interaction === 'multiply' ? 'selected' : ''}>Subtractive Glaze (Multiply)</option>
              <option value="soft-light" ${slab.interaction === 'soft-light' ? 'selected' : ''}>Vibrant Bleed (Soft-Light)</option>
              <option value="overlay" ${slab.interaction === 'overlay' ? 'selected' : ''}>Luminous Tension (Overlay)</option>
              <option value="screen" ${slab.interaction === 'screen' ? 'selected' : ''}>Chalk Wash (Screen)</option>
            </select>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.replaceSlabColor = function(idx) {
      slabs[idx].color = activePaletteColor;
      renderLayersList();
      renderRothko();
    };

    window.updateSlabProp = function(idx, prop, value) {
      slabs[idx][prop] = value;
      renderRothko();
    };

    window.removeSlab = function(idx) {
      if (slabs.length <= 1) return;
      slabs.splice(idx, 1);
      renderLayersList();
      renderRothko();
    };

    window.loadPreset = function(name) {
      const p = PRESETS[name];
      if (!p) return;
      groundColor = p.ground;
      slabs = p.slabs.map((s, i) => ({
        ...s,
        id: Date.now() + i,
        jitterSeed: Math.random()
      }));
      initUI();
      renderRothko();
    };

    // Organic feathered field renderer simulating multi-pass turpentine washes
    function drawOrganicField(targetCtx, x, y, w, h, color, feather, opacity, seed, blendMode) {
      targetCtx.save();
      targetCtx.globalCompositeOperation = blendMode;
      targetCtx.globalAlpha = opacity;

      // Hex to RGB
      const c = parseInt(color.replace('#',''), 16);
      const r = (c >> 16) & 255;
      const g = (c >> 8) & 255;
      const b = c & 255;

      // Rothko soft multi-contour wash: build layers from fuzzy halo down to saturated core
      const passes = 6;
      for (let p = 0; p < passes; p++) {
        const spread = (feather * (passes - p)) / passes;
        const curAlpha = (opacity / passes) * (1.1 + (p * 0.15));

        targetCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${Math.min(curAlpha, 1.0)})`;

        // Render an irregular quad with undulating feathered border
        targetCtx.beginPath();
        const stepsX = 24;
        const stepsY = 24;

        // Top edge
        for (let i = 0; i <= stepsX; i++) {
          const t = i / stepsX;
          const px = x - spread + (w + spread * 2) * t;
          const undulate = (pseudoNoise(t * 8, p, seed) - 0.5) * (feather * 0.45);
          const py = y - spread + undulate;
          if (i === 0) targetCtx.moveTo(px, py);
          else targetCtx.lineTo(px, py);
        }

        // Right edge
        for (let j = 0; j <= stepsY; j++) {
          const t = j / stepsY;
          const py = y - spread + (h + spread * 2) * t;
          const undulate = (pseudoNoise(p, t * 8, seed + 1.2) - 0.5) * (feather * 0.45);
          const px = x + w + spread + undulate;
          targetCtx.lineTo(px, py);
        }

        // Bottom edge
        for (let i = stepsX; i >= 0; i--) {
          const t = i / stepsX;
          const px = x - spread + (w + spread * 2) * t;
          const undulate = (pseudoNoise(t * 8, p, seed + 2.4) - 0.5) * (feather * 0.45);
          const py = y + h + spread + undulate;
          targetCtx.lineTo(px, py);
        }

        // Left edge
        for (let j = stepsY; j >= 0; j--) {
          const t = j / stepsY;
          const py = y - spread + (h + spread * 2) * t;
          const undulate = (pseudoNoise(p, t * 8, seed + 3.6) - 0.5) * (feather * 0.45);
          const px = x - spread + undulate;
          targetCtx.lineTo(px, py);
        }

        targetCtx.closePath();
        targetCtx.filter = `blur(${Math.max(spread * 0.35, 1)}px)`;
        targetCtx.fill();
      }

      targetCtx.restore();
    }

    // High performance canvas grain overlay
    function applyCanvasGrain(targetCtx, w, h, amount) {
      if (amount <= 0) return;
      const imgData = targetCtx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const grainFactor = (amount / 100) * 38;

      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * grainFactor;
        data[i]     = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
      }
      targetCtx.putImageData(imgData, 0, 0);
    }

    function renderRothko() {
      const W = canvas.width;
      const H = canvas.height;

      // 1. Base Priming Wash (Rothko's tinted rabbit-skin glue / raw stain ground)
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = groundColor;
      ctx.fillRect(0, 0, W, H);

      // Vignette / subtle wash modulation on ground
      const groundGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.1, W / 2, H / 2, Math.max(W, H) * 0.7);
      groundGrad.addColorStop(0, "rgba(255,255,255,0.04)");
      groundGrad.addColorStop(0.8, "rgba(0,0,0,0.12)");
      groundGrad.addColorStop(1, "rgba(0,0,0,0.32)");
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. Compute Stack Positions
      const totalRatio = slabs.reduce((acc, s) => acc + s.heightRatio, 0);
      const marginX = W * 0.085;
      const innerW = W - (marginX * 2);

      const availableH = H * 0.88;
      const gapTotal = H * 0.04 * Math.max(1, slabs.length - 1);
      const slabRegionH = availableH - gapTotal;
      const startY = (H - availableH) / 2;

      let currentY = startY;

      // 3. Render Each Pigment Slab with feathered edge bleeding
      slabs.forEach((slab, idx) => {
        const slabH = (slab.heightRatio / totalRatio) * slabRegionH;
        
        drawOrganicField(
          ctx, 
          marginX, 
          currentY, 
          innerW, 
          slabH, 
          slab.color, 
          slab.feather, 
          slab.transparency, 
          slab.jitterSeed,
          slab.interaction
        );

        // Advance to next slab with breathing margin
        currentY += slabH + (gapTotal / Math.max(1, slabs.length - 1));
      });

      // 4. Subtle Raw Cotton/Linen Weave Texture
      const grainAmount = document.getElementById('grain-slider').value;
      applyCanvasGrain(ctx, W, H, grainAmount);
    }

    // Launch
    window.addEventListener('DOMContentLoaded', () => {
      initUI();
      updateLighting();
      renderRothko();
    });
  </script>
</body>
</html>
