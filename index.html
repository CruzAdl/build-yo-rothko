<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B.Y.O.R. — Build Your Own Rothko</title>
  <link rel="stylesheet" href="./css/studio.css">
</head>
<body>

  <!-- Studio Stage (Blank Linen Canvas) -->
  <main id="studio-stage">
    <div id="canvas-viewport-frame">
      <canvas id="studio-canvas"></canvas>

      <!-- Solvent Wash Scrape Overlay -->
      <div id="solvent-overlay">
        <span class="solvent-text">Scraping Canvas</span>
      </div>
    </div>
  </main>

  <!-- Floating UI Overlay -->
  <aside id="hud-overlay">

    <!-- Draggable/Collapsible Top 6-Dot Cluster -->
    <header id="top-pill" class="floating-pill">
      
      <!-- Drag Grip Icon -->
      <div class="drag-grip" id="pill-drag-grip" title="Click to hide/show selectors • Drag to reposition">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="9" cy="5" r="1.5"></circle>
          <circle cx="15" cy="5" r="1.5"></circle>
          <circle cx="9" cy="12" r="1.5"></circle>
          <circle cx="15" cy="12" r="1.5"></circle>
          <circle cx="9" cy="19" r="1.5"></circle>
          <circle cx="15" cy="19" r="1.5"></circle>
        </svg>
      </div>

      <!-- GROUND SETUP CONTROLS (Multi-Tier Staggered Heights) -->
      <div id="ground-setup-controls" class="cluster-stack">
        <!-- Tier 1: Format -->
        <div class="cluster-tier">
          <span class="pill-label">Format</span>
          <div class="item-group" id="proportion-buttons"></div>
        </div>

        <!-- Tier 2: Base Canvas -->
        <div class="cluster-tier">
          <span class="pill-label">Base Canvas</span>
          <div class="item-group" id="ground-swatches"></div>
        </div>
      </div>

      <!-- STATUS BAR (Locked on Escape or once shapes are placed) -->
      <div id="studio-status-bar">
        <div class="status-metric">Shapes: <span id="baked-count-display">0</span></div>
        <div class="pill-divider"></div>
        <button id="btn-remove-last-shape" class="btn-secondary" title="Remove uncommitted shape from canvas (- / Backspace)">Remove Last Shape</button>
        <button id="btn-scrape-canvas" class="btn-secondary">Restart Painting</button>
        <button id="btn-work-is-done" class="btn-action-primary">Work is Done</button>
      </div>

    </header>

    <!-- Bottom Floating Dock -->
    <footer id="bottom-dock">
      
      <!-- Primary Idle Button: + Add Shape -->
      <button id="btn-open-staging">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Shape
      </button>

      <!-- Secondary Staging Inspector with 6-Dot Collapse/Toggle Button -->
      <div id="staging-inspector" class="floating-dock">
        
        <!-- 6-Dot Grip Toggle for Secondary Staging Inspector -->
        <div class="drag-grip" id="staging-drag-grip" title="Click or hit Esc to hide/show selectors">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="9" cy="5" r="1.5"></circle>
            <circle cx="15" cy="5" r="1.5"></circle>
            <circle cx="9" cy="12" r="1.5"></circle>
            <circle cx="15" cy="12" r="1.5"></circle>
            <circle cx="9" cy="19" r="1.5"></circle>
            <circle cx="15" cy="19" r="1.5"></circle>
          </svg>
        </div>

        <div id="staging-content-wrapper">
          <!-- Shape -->
          <div class="staging-row">
            <span class="row-label">Shape</span>
            <div class="item-group" id="shape-strip"></div>
          </div>

          <!-- Colour -->
          <div class="staging-row">
            <span class="row-label">Colour</span>
            <div class="pigment-bar-container">
              <button id="btn-open-picker" class="color-picker-trigger" type="button" title="Open Rothko Pigment Lab & Custom Color Picker">
                <span class="picker-wheel-dot"></span>
                <span>Mix</span>
              </button>
              <div class="item-group" id="pigment-strip"></div>
            </div>
          </div>

          <!-- Texture -->
          <div class="staging-row">
            <span class="row-label">Texture</span>
            <div class="item-group" id="texture-strip"></div>
          </div>

          <!-- Edge & Bleed -->
          <div class="staging-row">
            <span class="row-label">Edge</span>
            <div class="item-group" id="edge-strip"></div>
            <div class="slider-group" style="margin-left: 12px;">
              <span class="row-label" style="width: auto;">Bleed:</span>
              <input type="range" id="slider-bleed" min="0" max="100" value="50">
            </div>
          </div>

          <!-- Action Row -->
          <div class="staging-actions">
            <button id="btn-bake-shape" class="btn-place">Place Shape (Enter)</button>
          </div>
        </div>

      </div>

    </footer>

    <!-- Color Picker Laboratory Popover -->
    <div id="color-picker-popover" class="picker-popover" style="display: none;">
      <div class="picker-header">
        <div class="picker-header-title">
          <span class="picker-title-dot"></span>
          <span>Pigment Laboratory</span>
        </div>
        <button id="btn-close-picker" class="picker-close-btn" type="button" title="Close">✕</button>
      </div>

      <div class="picker-body">
        <!-- Live Halo & Body Vibration Preview -->
        <div class="picker-preview-box">
          <div class="preview-glow-stage">
            <div class="preview-halo" id="picker-preview-halo"></div>
            <div class="preview-core" id="picker-preview-core"></div>
          </div>
          <div class="preview-meta">
            <span id="picker-preview-name" class="preview-name">Custom Mix</span>
            <div class="preview-badges">
              <span class="preview-sublabel">Core:</span>
              <span id="picker-preview-hex" class="hex-badge">#8C161C</span>
              <span class="preview-sublabel" style="margin-left: 6px;">Halo:</span>
              <span id="picker-preview-halo-hex" class="hex-badge halo-badge">#B83B28</span>
            </div>
          </div>
        </div>

        <!-- Interactive Sliders: Hue, Chroma (Saturation), Depth (Lightness) -->
        <div class="picker-controls">
          <div class="picker-slider-row">
            <label for="picker-hue">Hue</label>
            <input type="range" id="picker-hue" min="0" max="360" value="357" class="hue-slider">
          </div>
          <div class="picker-slider-row">
            <label for="picker-sat">Chroma</label>
            <input type="range" id="picker-sat" min="5" max="100" value="84" class="sat-slider">
          </div>
          <div class="picker-slider-row">
            <label for="picker-light">Depth</label>
            <input type="range" id="picker-light" min="5" max="95" value="32" class="light-slider">
          </div>
        </div>

        <!-- Hex Input + Eyedropper + Native Color Picker + Apply -->
        <div class="picker-actions-row">
          <div class="hex-input-wrap">
            <span class="hex-prefix">#</span>
            <input type="text" id="picker-hex-input" value="8C161C" maxlength="6" spellcheck="false" title="Hex color code">
          </div>

          <!-- Eyedropper API (Sample from canvas) -->
          <button id="btn-eyedropper" class="picker-icon-btn" type="button" title="Sample color from screen (Eyedropper)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="m2 22 1-1h3l9-9"></path>
              <path d="M14 4l6 6"></path>
              <path d="m18 2 4 4-2 2-4-4z"></path>
            </svg>
          </button>

          <!-- Native OS System Color Picker wrapper -->
          <label class="picker-native-label" title="Open OS System Color Picker">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a7 7 0 0 0 7 7c0 2-2 3-2 3s-1 1-1 3"></path>
            </svg>
            <input type="color" id="native-color-input" value="#8c161c">
          </label>

          <button id="btn-apply-color" class="btn-picker-apply" type="button">Apply Tint</button>
        </div>
      </div>
    </div>

  </aside>

  <!-- Gallery Light Room View -->
  <section id="gallery-room">
    <div id="gallery-spotlight-field"></div>
    <div id="gallery-floor"></div>

    <div id="gallery-installation-stage">
      <div id="gallery-wall-frame">
        <canvas id="gallery-canvas"></canvas>

        <!-- Museum Gallery Plaque: Tiny realistic scale, expands on click to readable size, collapses on re-click -->
        <article id="museum-plaque" title="Click to expand / collapse label">
          <div class="plaque-header-row">
            <span class="plaque-artist" contenteditable="true" spellcheck="false" title="Click to edit Name">Name</span>
          </div>

          <div class="plaque-line">
            <span class="plaque-title" contenteditable="true" spellcheck="false" title="Click to edit title">Untitled</span>,
            <span class="plaque-year immutable-text">2026</span>
          </div>

          <p class="plaque-medium immutable-text">Oil on Canvas</p>

          <p class="plaque-provenance" id="plaque-provenance-text" contenteditable="true" spellcheck="false" title="Click to edit provenance state / number of tries">First state — executed without prior scraped studies</p>
        </article>
      </div>
    </div>

    <!-- Gallery Light Room HUD -->
    <nav id="gallery-hud" class="floating-dock">
      <div class="hud-group">
        <label for="wall-select">Wall</label>
        <select id="wall-select" class="hud-select"></select>
      </div>

      <div class="pill-divider"></div>

      <div class="hud-group">
        <label for="slider-light-int">Brightness</label>
        <input type="range" id="slider-light-int" min="20" max="100" value="65">
      </div>

      <div class="hud-group">
        <label for="slider-light-kelvin">Warmth</label>
        <input type="range" id="slider-light-kelvin" min="2400" max="5500" step="50" value="3200">
      </div>

      <div class="pill-divider"></div>

      <button id="btn-take-photo" class="btn-photo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align: middle; margin-right: 4px;">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Take Picture
      </button>

      <button id="btn-return-studio" class="btn-return-studio">Return to Studio</button>
    </nav>
  </section>

  <!-- Shutter Flash -->
  <div id="shutter-flash"></div>

  <!-- Entry Script -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
